<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>J.A.R.V.I.S.</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>
  <body>
    <div class="scanlines" aria-hidden="true"></div>

    <div class="app">

      <!-- Backdrop — mobile only, closes the sidebar drawer on tap -->
      <button type="button" id="sidebar-backdrop" class="sidebar-backdrop" aria-hidden="true" tabindex="-1"></button>

      <!-- ── Left sidebar ─────────────────────────────── -->
      <aside class="sidebar" id="sidebar-panel">
        <span class="corner bl" aria-hidden="true"></span>

        <section class="sidebar-section">
          <div class="sidebar-label">CLOCK</div>
          <div class="clock-time" id="clock-time">00:00:00</div>
          <div class="clock-date" id="clock-date">--- -- ----</div>
        </section>

        <div class="sidebar-divider"></div>

        <section class="sidebar-section">
          <div class="sidebar-label">SYSTEM</div>
          <div class="stat-row">
            <span class="stat-name">CPU</span>
            <div class="stat-bar"><div class="stat-fill" id="cpu-fill"></div></div>
            <span class="stat-val" id="cpu-val">--%</span>
          </div>
          <div class="stat-row">
            <span class="stat-name">RAM</span>
            <div class="stat-bar"><div class="stat-fill" id="ram-fill"></div></div>
            <span class="stat-val" id="ram-val">--%</span>
          </div>
          <div class="stat-detail" id="ram-detail"></div>
        </section>

        <div class="sidebar-divider"></div>

        <section class="sidebar-section">
          <div class="sidebar-label">SHORTCUTS</div>
          <div class="shortcut-row"><kbd>ENTER</kbd><span>Send</span></div>
          <div class="shortcut-row"><kbd>CTRL+M</kbd><span>Mic</span></div>
          <div class="shortcut-row"><kbd>CTRL+L</kbd><span>Clear</span></div>
          <div class="shortcut-row"><kbd>ESC</kbd><span>Cancel</span></div>
        </section>
      </aside>

      <!-- ── Main HUD ───────────────────────────────── -->
      <main class="hud">
        <span class="corner br" aria-hidden="true"></span>

        <header class="hud-header">
          <button type="button" id="sidebar-toggle" class="sidebar-toggle" aria-label="System info" aria-expanded="false" aria-controls="sidebar-panel">☰</button>
          <div class="arc-ring" aria-hidden="true">
            <div class="arc-core"></div>
          </div>
          <div class="hud-title">
            <h1>J.A.R.V.I.S.</h1>
            <p class="subtitle">Just A Rather Very Intelligent System</p>
          </div>
          <div class="status-dots" aria-hidden="true">
            <span class="dot active"></span>
            <span class="dot active"></span>
            <span class="dot" id="mic-dot"></span>
          </div>
        </header>

        <div class="divider"></div>

        <div id="messages" class="messages" aria-live="polite">
          <div class="message jarvis">
            <span class="label">JARVIS</span>
            <span class="text">Online and ready, sir. How can I assist you?</span>
          </div>
        </div>

        <div class="divider"></div>

        <div id="connection-banner" class="connection-banner" role="alert" hidden>
          <span class="connection-banner-text" id="connection-banner-text"></span>
        </div>

        <form id="chat-form" class="input-row">
          <span class="prompt-symbol">&gt;_</span>
          <input id="chat-input" placeholder="Enter command..." autocomplete="off" spellcheck="false" />
          <button type="button" id="mic-btn" class="mic-btn" title="Ctrl+M">MIC</button>
          <button type="submit">SEND</button>
        </form>

        <div class="hud-footer">
          <span class="footer-item">DAMIANOS INDUSTRIES</span>
          <span class="footer-item blink" id="status-text" role="status" aria-live="polite">SYSTEM ONLINE</span>
          <span class="footer-item">v0.0.0</span>
        </div>
      </main>

    </div>
  </body>
</html>
